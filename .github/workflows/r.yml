# sommieR — intégration continue
#
# Porté depuis nemeton (parité des dépôts). Une différence de fond : la
# couche d'accès de sommieR se teste contre une vraie base PostGIS, montée
# ici en service container. Sans elle, les tests de base se sauteraient tout
# seuls et le vert serait trompeur — le job `tests` échoue donc si la base
# n'est pas jointe, plutôt que de passer à vide.
name: R-CMD-check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ============================================================
  # Job 0 : cohérence des versions (DESCRIPTION = NEWS = CITATION)
  # Garde-fou contre le drift. On ne compare PAS au tag git (créé après le
  # merge par release.yml), seulement aux fichiers du dépôt : la version de
  # release doit être posée AVANT le push.
  # ============================================================
  version-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: DESCRIPTION = NEWS.md = CITATION.cff
        run: |
          desc=$(awk '/^Version:/{print $2; exit}' DESCRIPTION)
          if ! [[ "$desc" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Cycle dev ($desc) — garde-fou de cohérence sauté."
            exit 0
          fi
          news=$(grep -m1 -oE '[0-9]+\.[0-9]+\.[0-9]+' NEWS.md)
          cff=$(grep -m1 -E '^version:' CITATION.cff | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "DESCRIPTION=$desc  NEWS=$news  CITATION=$cff"
          if [ -z "$desc" ] || [ "$desc" != "$news" ] || [ "$desc" != "$cff" ]; then
            echo "::error::Versions désalignées (DESCRIPTION=$desc, NEWS=$news, CITATION=$cff)"
            exit 1
          fi
          echo "✅ versions alignées : $desc"

  # ============================================================
  # Job 1 : R CMD check (structure, documentation, imports)
  # ============================================================
  R-CMD-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v4

      # L'installation de R pend par intermittence sur les runners (dix fois
      # le 19 août 2026), sans jamais dépasser cette étape : le job restait
      # alors bloqué jusqu'à son `timeout-minutes`, une demi-heure pour rien.
      # Une borne courte transforme le blocage en échec rapide, et la seconde
      # tentative l'absorbe sans intervention. `continue-on-error` porte sur
      # la première seulement — si la seconde échoue aussi, le job doit
      # échouer : ce n'est plus un caprice de réseau.
      - name: Setup R
        id: setup_r
        uses: r-lib/actions/setup-r@v2
        timeout-minutes: 8
        continue-on-error: true
        with:
          r-version: 'release'
          use-public-rspm: true

      # Tuer une étape ne tue pas ses processus fils : le `gdebi` lancé par la
      # première tentative tient toujours le verrou dpkg, et la seconde
      # échouait en deux secondes sur « Could not get lock
      # /var/lib/dpkg/lock-frontend ». On solde donc l'installation
      # interrompue avant de réessayer.
      #
      # `pkill` sans `-f` filtre sur le nom du processus et non sur la ligne
      # de commande : le motif ne peut donc pas se reconnaître dans le `sudo`
      # qui le porte et se tuer lui-même.
      - name: Solder l'apt de la tentative interrompue
        if: steps.setup_r.outcome == 'failure'
        run: |
          sudo pkill -9 '^(apt|apt-get|gdebi|dpkg)$' || true
          sudo rm -f /var/lib/dpkg/lock /var/lib/dpkg/lock-frontend \
                     /var/lib/apt/lists/lock /var/cache/apt/archives/lock
          sudo dpkg --configure -a || true

      - name: Setup R (seconde tentative)
        if: steps.setup_r.outcome == 'failure'
        uses: r-lib/actions/setup-r@v2
        timeout-minutes: 8
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libcurl4-openssl-dev libxml2-dev libpq-dev

      # Même parade que pour l'installation de R : l'étape pend elle aussi par
      # intermittence, et sans borne le job attendait ses trente minutes. Le
      # plafond est plus haut ici — l'installation des dépendances prend trois
      # à quatre minutes avec le cache chaud, mais peut légitimement en
      # demander une quinzaine à froid, et couper trop tôt ferait échouer des
      # constructions saines. La seconde tentative repart du cache déjà posé
      # par la première : elle reprend, elle ne recommence pas.
      - name: Install R dependencies
        id: deps
        uses: r-lib/actions/setup-r-dependencies@v2
        timeout-minutes: 20
        continue-on-error: true
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Install R dependencies (seconde tentative)
        if: steps.deps.outcome == 'failure'
        uses: r-lib/actions/setup-r-dependencies@v2
        timeout-minutes: 20
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Check package
        uses: r-lib/actions/check-r-package@v2
        with:
          # `--no-tests` : la suite testthat tourne dans le job `tests`
          # dédié, qui seul dispose de la base PostGIS.
          args: 'c("--no-manual", "--no-tests", "--as-cran")'
          build_args: 'c("--no-manual")'
          error-on: '"warning"'
          upload-snapshots: true

  # ============================================================
  # Job 2 : tests (testthat) contre une base PostGIS réelle
  # ============================================================
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sommier_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true
      SOMMIER_TEST_DB: sommier_test
      SOMMIER_TEST_HOST: localhost
      SOMMIER_TEST_PORT: 5432
      SOMMIER_TEST_USER: postgres
      SOMMIER_TEST_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Setup R
        id: setup_r
        uses: r-lib/actions/setup-r@v2
        timeout-minutes: 8
        continue-on-error: true
        with:
          r-version: 'release'
          use-public-rspm: true

      # Tuer une étape ne tue pas ses processus fils : le `gdebi` lancé par la
      # première tentative tient toujours le verrou dpkg, et la seconde
      # échouait en deux secondes sur « Could not get lock
      # /var/lib/dpkg/lock-frontend ». On solde donc l'installation
      # interrompue avant de réessayer.
      #
      # `pkill` sans `-f` filtre sur le nom du processus et non sur la ligne
      # de commande : le motif ne peut donc pas se reconnaître dans le `sudo`
      # qui le porte et se tuer lui-même.
      - name: Solder l'apt de la tentative interrompue
        if: steps.setup_r.outcome == 'failure'
        run: |
          sudo pkill -9 '^(apt|apt-get|gdebi|dpkg)$' || true
          sudo rm -f /var/lib/dpkg/lock /var/lib/dpkg/lock-frontend \
                     /var/lib/apt/lists/lock /var/cache/apt/archives/lock
          sudo dpkg --configure -a || true

      - name: Setup R (seconde tentative)
        if: steps.setup_r.outcome == 'failure'
        uses: r-lib/actions/setup-r@v2
        timeout-minutes: 8
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libcurl4-openssl-dev libxml2-dev libpq-dev postgresql-client

      # Même parade que pour l'installation de R : l'étape pend elle aussi par
      # intermittence, et sans borne le job attendait ses trente minutes. Le
      # plafond est plus haut ici — l'installation des dépendances prend trois
      # à quatre minutes avec le cache chaud, mais peut légitimement en
      # demander une quinzaine à froid, et couper trop tôt ferait échouer des
      # constructions saines. La seconde tentative repart du cache déjà posé
      # par la première : elle reprend, elle ne recommence pas.
      - name: Install R dependencies
        id: deps
        uses: r-lib/actions/setup-r-dependencies@v2
        timeout-minutes: 20
        continue-on-error: true
        with:
          extra-packages: |
            any::testthat
            any::devtools
            any::RPostgres
          needs: check

      - name: Install R dependencies (seconde tentative)
        if: steps.deps.outcome == 'failure'
        uses: r-lib/actions/setup-r-dependencies@v2
        timeout-minutes: 20
        with:
          extra-packages: |
            any::testthat
            any::devtools
            any::RPostgres
          needs: check

      # Le vert ne doit pas pouvoir venir d'un saut : si la base n'est pas
      # joignable, les tests de la couche d'accès se sauteraient sans bruit.
      - name: Vérifier que la base de test répond
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d sommier_test \
            -c "CREATE EXTENSION IF NOT EXISTS postgis;" \
            -c "SELECT postgis_version();"

      # Une seule exécution de la suite, dont on tire deux verdicts : les
      # échecs, et l'absence de saut POUR CAUSE DE BASE INJOIGNABLE.
      #
      # Le garde-fou vise ce cas précis et non tout saut : un test qui
      # n'exerce un chemin d'erreur qu'en l'absence d'un paquet facultatif se
      # saute légitimement quand ce paquet est présent. Refuser tout saut
      # faisait échouer la CI sur un test dont le seul tort était que `sf`
      # était installé.
      - name: Run tests
        run: |
          res <- devtools::test(reporter = "summary")
          plat <- as.data.frame(res)
          echecs <- sum(plat$failed) + sum(plat$error)

          motifs <- unlist(lapply(res, function(fichier) {
            vapply(fichier$results, function(r) {
              if (inherits(r, "expectation_skip")) conditionMessage(r) else ""
            }, character(1))
          }))
          motifs <- motifs[nzchar(motifs)]
          sans_base <- grep("Aucune base PostgreSQL", motifs, value = TRUE)

          cat("\nechecs:", echecs, " sauts:", length(motifs), "\n")
          if (length(motifs)) cat("motifs de saut :\n -", paste(motifs, collapse = "\n - "), "\n")
          if (length(sans_base)) {
            stop("La base de test n'a pas ete jointe : ", length(sans_base),
                 " test(s) sautes alors que le service PostGIS tourne.")
          }
          if (echecs > 0) {
            stop("La suite a echoue.")
          }
        shell: Rscript {0}

  # ============================================================
  # Job 3 : couverture (covr + codecov)
  # ============================================================
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [R-CMD-check]

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sommier_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true
      SOMMIER_TEST_DB: sommier_test
      SOMMIER_TEST_HOST: localhost
      SOMMIER_TEST_PORT: 5432
      SOMMIER_TEST_USER: postgres
      SOMMIER_TEST_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Setup R
        id: setup_r
        uses: r-lib/actions/setup-r@v2
        timeout-minutes: 8
        continue-on-error: true
        with:
          r-version: 'release'
          use-public-rspm: true

      # Tuer une étape ne tue pas ses processus fils : le `gdebi` lancé par la
      # première tentative tient toujours le verrou dpkg, et la seconde
      # échouait en deux secondes sur « Could not get lock
      # /var/lib/dpkg/lock-frontend ». On solde donc l'installation
      # interrompue avant de réessayer.
      #
      # `pkill` sans `-f` filtre sur le nom du processus et non sur la ligne
      # de commande : le motif ne peut donc pas se reconnaître dans le `sudo`
      # qui le porte et se tuer lui-même.
      - name: Solder l'apt de la tentative interrompue
        if: steps.setup_r.outcome == 'failure'
        run: |
          sudo pkill -9 '^(apt|apt-get|gdebi|dpkg)$' || true
          sudo rm -f /var/lib/dpkg/lock /var/lib/dpkg/lock-frontend \
                     /var/lib/apt/lists/lock /var/cache/apt/archives/lock
          sudo dpkg --configure -a || true

      - name: Setup R (seconde tentative)
        if: steps.setup_r.outcome == 'failure'
        uses: r-lib/actions/setup-r@v2
        timeout-minutes: 8
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libcurl4-openssl-dev libxml2-dev libpq-dev postgresql-client

      # Même parade que pour l'installation de R : l'étape pend elle aussi par
      # intermittence, et sans borne le job attendait ses trente minutes. Le
      # plafond est plus haut ici — l'installation des dépendances prend trois
      # à quatre minutes avec le cache chaud, mais peut légitimement en
      # demander une quinzaine à froid, et couper trop tôt ferait échouer des
      # constructions saines. La seconde tentative repart du cache déjà posé
      # par la première : elle reprend, elle ne recommence pas.
      - name: Install R dependencies
        id: deps
        uses: r-lib/actions/setup-r-dependencies@v2
        timeout-minutes: 20
        continue-on-error: true
        with:
          extra-packages: |
            any::covr
            any::RPostgres
          needs: coverage

      - name: Install R dependencies (seconde tentative)
        if: steps.deps.outcome == 'failure'
        uses: r-lib/actions/setup-r-dependencies@v2
        timeout-minutes: 20
        with:
          extra-packages: |
            any::covr
            any::RPostgres
          needs: coverage

      - name: Préparer PostGIS
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d sommier_test \
            -c "CREATE EXTENSION IF NOT EXISTS postgis;"

      - name: Compute coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          covr::to_cobertura(cov)
        shell: Rscript {0}

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./cobertura.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
