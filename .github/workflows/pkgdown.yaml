# Site pkgdown publié sur gh-pages.
# Porté depuis nemeton. Les articles se construisent contre une base PostGIS
# réelle, montée ici en service container, et l'un d'eux appelle Quarto pour
# engendrer le document de gestion antérieure. Sans l'un ou l'autre, ils se
# rendraient sans tableau ni document et le site publierait une démonstration
# vide : les étapes de vérification échouent donc plutôt que de laisser
# passer un site muet.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Comme les jobs de `r.yml`. Sans borne, une étape qui pend — le
    # 19 août 2026, l'installation de R — retient le job des heures : le site
    # ne se déploie jamais et rien ne le signale, la panne la plus coûteuse à
    # diagnostiquer étant celle qui n'échoue pas. La construction prend
    # 2 à 3 minutes ; 30 laissent de la marge sans laisser pendre.
    timeout-minutes: 30
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sommier_article
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      SOMMIER_ARTICLE_DB: sommier_article
      SOMMIER_ARTICLE_HOST: localhost
      SOMMIER_ARTICLE_PORT: 5432
      SOMMIER_ARTICLE_USER: postgres
      SOMMIER_ARTICLE_PASSWORD: postgres
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      # L'article « Le document engendré » appelle `sommier_rapport_quarto()`,
      # qui exige Quarto dans le PATH. Les runners GitHub ne le fournissent
      # pas. Seul le rendu HTML est engendré : le PDF demanderait LaTeX.
      - uses: quarto-dev/quarto-actions/setup@v2

      # Même parade qu'en CI : l'installation de R pend par intermittence sur
      # les runners, et sans borne le job attendait jusqu'à son propre
      # `timeout-minutes` — donc, ici, sans jamais publier le site.
      - name: Setup R
        id: setup_r
        uses: r-lib/actions/setup-r@v2
        timeout-minutes: 8
        continue-on-error: true
        with:
          use-public-rspm: true

      # Tuer une étape ne tue pas ses processus fils : le `gdebi` lancé par la
      # première tentative tient toujours le verrou dpkg, et la seconde
      # échouait en deux secondes sur « Could not get lock
      # /var/lib/dpkg/lock-frontend ». On solde donc l'installation
      # interrompue avant de réessayer.
      #
      # `pkill` sans `-f` filtre sur le nom du processus et non sur la ligne
      # de commande : le motif ne peut donc pas se reconnaître dans le `sudo`
      # qui le porte et se tuer lui-même.
      - name: Solder l'apt de la tentative interrompue
        if: steps.setup_r.outcome == 'failure'
        run: |
          sudo pkill -9 '^(apt|apt-get|gdebi|dpkg)$' || true
          sudo rm -f /var/lib/dpkg/lock /var/lib/dpkg/lock-frontend \
                     /var/lib/apt/lists/lock /var/cache/apt/archives/lock
          sudo dpkg --configure -a || true

      - name: Setup R (seconde tentative)
        if: steps.setup_r.outcome == 'failure'
        uses: r-lib/actions/setup-r@v2
        timeout-minutes: 8
        with:
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libcurl4-openssl-dev libxml2-dev libpq-dev postgresql-client

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgdown
            any::RPostgres
            local::.
          needs: website

      - name: Vérifier que la base de l'article répond
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d sommier_article \
            -c "CREATE EXTENSION IF NOT EXISTS postgis;" \
            -c "SELECT postgis_version();"

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      # Le rendu d'un article ne signale pas l'absence de données : il rend le
      # code et se tait. On vérifie donc que la page publiée porte bien les
      # écritures de Couchey, et non l'avertissement de repli.
      - name: L'article porte-t-il les données ?
        run: |
          page=docs/articles/gestion-anterieure.html
          test -f "$page" || { echo "::error::Article non construit"; exit 1; }
          if grep -q "Article rendu sans base" "$page"; then
            echo "::error::L'article s'est rendu sans base : tableaux absents."
            exit 1
          fi
          grep -q "Couchey" "$page" || { echo "::error::Jeu de démonstration absent de l'article"; exit 1; }
          echo "✅ article construit avec les données de Couchey"

      # Même piège pour l'article qui encadre le document engendré : sans base
      # ni Quarto, il se rend avec un cadre vide et un encart de repli.
      - name: Le document engendré est-il là ?
        run: |
          page=docs/articles/rapport-engendre.html
          rapport=docs/articles/rapport-gestion-anterieure.html
          test -f "$page" || { echo "::error::Article non construit"; exit 1; }
          if grep -q "Document non engendré" "$page"; then
            echo "::error::Le document n'a pas été engendré : base ou Quarto absents."
            exit 1
          fi
          test -f "$rapport" || { echo "::error::Le document engendré n'a pas suivi vers le site"; exit 1; }
          grep -q "jeu de d" "$rapport" || { echo "::error::Le document ne porte pas son avertissement de démonstration"; exit 1; }
          echo "✅ document engendré ($(du -h "$rapport" | cut -f1))"

      - name: Deploy to GitHub pages 🚀
        # Publication seulement sur push main / release publiée — jamais sur
        # une pull request ni un déclenchement manuel, qui se contentent de
        # valider que le site se construit.
        if: github.event_name == 'push' || github.event_name == 'release'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
