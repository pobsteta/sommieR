url: https://pobsteta.github.io/sommieR/

template:
  bootstrap: 5
  bootswatch: flatly
  bslib:
    primary: "#2E7D32"
    success: "#4CAF50"

home:
  title: "sommieR - Le sommier forestier unifié"
  description: >
    Le sommier des forêts comme système de registres permanents, strictement
    append-only, rendu vérifiable par un chaînage de hachages SHA-256 sur
    sérialisation canonique RFC 8785.
  links:
  - text: Voir sur GitHub
    href: https://github.com/pobsteta/sommieR
  - text: Package coeur (nemeton)
    href: https://github.com/pobsteta/nemeton

navbar:
  structure:
    left:  [reference, articles, news]
    right: [search, github]

articles:
  - title: "Prise en main"
    navbar: ~
    contents:
    - "articles/gestion-anterieure"

reference:
  - title: "Écrire et lire le sommier"
    desc: >
      Le cycle de vie d'une entrée : construction, chaînage, écriture,
      relecture.
    contents:
    - sommier_entree
    - sommier_ajouter
    - sommier_lire
    - sommier_chainer
    - entrees_en_data_frame

  - title: "Registres"
    desc: >
      Les neuf registres du sommier unifié et les constructeurs de payload
      des registres ouverts à l'écriture.
    contents:
    - SOMMIER_REGISTRES
    - SOMMIER_REGISTRES_OUVERTS
    - SOMMIER_SCHEMA_VERSIONS
    - valider_payload
  - title: "Registre 1 — validations"
    desc: "Imprimé A10 : visas annuels, arrêtés, délibérations, agréments."
    contents:
    - registre1_validation
    - SOMMIER_TYPES_VALIDATION
    - SOMMIER_AUTORITES
  - title: "Registre 2 — foncier et limites"
    desc: "Imprimé A40 : délimitation, bornage, acquisitions, servitudes."
    contents:
    - registre2_foncier
    - SOMMIER_TYPES_FONCIER
  - title: "Registre 3 — droits et concessions"
    desc: "Imprimé A50C, et l'affouage propre à la forêt communale."
    contents:
    - registre3_droit
    - registre3_affouage
    - SOMMIER_TYPES_DROIT
  - title: "Registre 4 — infrastructures"
    desc: "Imprimés A50D et A50D bis, ouvrages DFCI compris."
    contents:
    - registre4_voirie
    - registre4_equipement
    - sommier_densite_voirie
    - SOMMIER_TYPES_INFRASTRUCTURE
    - SOMMIER_REVETEMENTS
    - SOMMIER_USAGES_VOIRIE
  - title: "Registre 5 — coupes et récoltes"
    desc: "Imprimés A50E, A50F et A50I."
    contents:
    - registre5_coupe
    - SOMMIER_TYPES_COUPE
    - SOMMIER_TYPES_MARTELES
  - title: "Registre 6 — travaux"
    desc: "Imprimés A50J, A50J bis et A50H."
    contents:
    - registre6_travaux
  - title: "Registre 7 — comptabilité"
    desc: >
      Imprimé A50G, budget prévisionnel et bilan financier.
    contents:
    - registre7_ecriture
    - SOMMIER_POSTES_COMPTABLES
    - SOMMIER_DISPOSITIFS_FISCAUX
    - budget_definir
    - sommier_bilan_financier
    - sommier_execution_budgetaire
  - title: "Registre 8 — évènements et faune"
    desc: >
      Imprimés A50K et A50L, équilibre forêt-gibier, et détections issues de
      la télédétection.
    contents:
    - registre8_phenomene
    - registre8_tableau_chasse
    - registre8_equilibre_gibier
    - registre8_detection
    - registre8_suite_detection
    - SOMMIER_TYPES_EVENEMENT
    - SOMMIER_NATURES_PHENOMENE
    - sommier_importer_detections
    - sommier_valider_detection
  - title: "Registre 9 — patrimoine remarquable"
    desc: >
      Série A50 r/* : arbres, peuplements, vestiges, espèces protégées,
      habitats — et ce qu'ils apportent à l'IBP.
    contents:
    - registre9_arbre
    - registre9_peuplement
    - registre9_vestige
    - registre9_espece
    - registre9_habitat
    - sommier_elements_ibp
    - SOMMIER_TYPES_REMARQUABLE
    - SOMMIER_ETATS_SANITAIRES
    - SOMMIER_SEUIL_TGB_CM
  - title: "Jeu de démonstration"
    desc: >
      Un sommier complet et cohérent sur les neuf registres, pour la prise en
      main. Les écritures sont fictives, la géométrie vient de la fixture
      Couchey de nemetonshiny.
    contents:
    - sommier_demo_couchey
    - SOMMIER_PARCELLES_COUCHEY
    - NOM_FORET_DEMO
  - title: "Exports réglementaires et cartographiques"
    desc: >
      Le sommier comme source des documents de gestion, et le partage
      vérifiable.
    contents:
    - sommier_gestion_anterieure
    - sommier_rapport_markdown
    - SOMMIER_REFERENTIELS
    - sommier_exporter_sig
    - SOMMIER_FORMATS_SIG
    - sommier_rapport_quarto
    - SOMMIER_FORMATS_QUARTO
  - title: "Visa signé et horodatage"
    desc: >
      Ce qui rend le sommier opposable : la signature détachée de la tête de
      chaîne, son horodatage qualifié, et leur vérification.
    contents:
    - sommier_viser
    - sommier_ancrer
    - sommier_verifier_visas
    - sommier_signataire
    - signataire_cle
    - signataire_keycloak
    - jws_signer_detache
    - jws_verifier_detache
    - jwt_claims
    - base64url_encoder
    - base64url_decoder
    - SOMMIER_ALGOS_JWS
    - tsa_requete
    - tsa_lire_reponse
    - tsa_horodater
    - tsa_transport_curl
    - SOMMIER_STATUTS_TSA

  - title: "Intégrité vérifiable"
    desc: >
      Le chaînage de hachages et sa vérification, reproductibles par un tiers
      à partir d'un export.
    contents:
    - sommier_verifier
    - sommier_verifier_chaine
    - sommier_empreinte
    - sommier_empreinte_genese
    - sommier_enregistrement_canonique
    - SOMMIER_CHAMPS_EMPREINTE
    - SOMMIER_VERSION_CHAINE
    - empreinte_hex
    - empreinte_depuis_hex

  - title: "Sérialisation canonique (RFC 8785)"
    desc: >
      La brique sur laquelle porte le hachage : deux représentations d'un même
      payload doivent produire les mêmes octets.
    contents:
    - jcs
    - jcs_nombre
    - jcs_depuis_json

  - title: "Périmètre de gestion"
    desc: >
      Forêts, unités de gestion à identifiant stable, filiation et exercices.
    contents:
    - foret_creer
    - ug_creer
    - ug_lire
    - ug_scinder
    - ug_fusionner
    - exercice_definir
    - SOMMIER_REGIMES

  - title: "Base de données"
    contents:
    - sommier_init_schema
    - sommier_revoquer_mutations
    - decouper_sql

  - title: "Consultation et export"
    contents:
    - sommier_balance_possibilite
    - sommier_exporter_manifeste
    - sommier_verifier_manifeste
    - SOMMIER_VERSION_MANIFESTE

  - title: "Utilitaires"
    contents:
    - uuid_v4
    - sommieR-package
